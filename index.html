<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070B16" />
    <meta name="robots" content="index, follow" />
    <title>Perfection — Full-Service Marketing Agency</title>
    <meta
      name="description"
      content="Perfection is a full-service marketing agency helping brands grow through creativity, strategy, and performance."
    />
    <link rel="canonical" href="https://perfection-agency.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Perfection" />
    <meta property="og:title" content="Perfection — Full-Service Marketing Agency" />
    <meta
      property="og:description"
      content="Full-service marketing agency — branding, social media, and performance marketing that turns attention into real business growth. Egypt & the GCC."
    />
    <meta property="og:url" content="https://perfection-agency.com/" />
    <meta property="og:image" content="https://perfection-agency.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Perfection — Full-Service Marketing Agency" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Perfection — Full-Service Marketing Agency" />
    <meta
      name="twitter:description"
      content="Full-service marketing agency — branding, social media, and performance marketing that turns attention into real business growth. Egypt & the GCC."
    />
    <meta name="twitter:image" content="https://perfection-agency.com/og-image.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />

    <!-- Identity: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://perfection-agency.com/#org",
          "name": "Perfection",
          "url": "https://perfection-agency.com/",
          "logo": "https://perfection-agency.com/logo.svg",
          "description": "Full-service marketing agency — branding, social media, and performance marketing for ambitious brands.",
          "areaServed": [
            { "@type": "Country", "name": "Egypt" },
            { "@type": "Place", "name": "GCC" }
          ],
          "knowsAbout": [
            "Brand Identity",
            "Social Media Management",
            "Performance Marketing",
            "Content Creation & Production",
            "Advertising Management",
            "SEO",
            "Media Production & Motion Design",
            "Website Design"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://perfection-agency.com/#site",
          "url": "https://perfection-agency.com/",
          "name": "Perfection",
          "inLanguage": "en",
          "publisher": { "@id": "https://perfection-agency.com/#org" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
