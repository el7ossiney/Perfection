server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed Vite build assets — safe to cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images and fonts — cache for a week
    location ~* \.(png|svg|jpg|jpeg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback — no $uri/ branch: a real dir named like a route (e.g.
    # /projects) would 301 to a slash-URL and downgrade to http
    location / {
        try_files $uri /index.html;
    }

    absolute_redirect off;
}
